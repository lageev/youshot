<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>YouShot six-layer viewfinder foreground</title>
  <desc>Six progressively smaller copies of a rounded viewfinder outline.</desc>
  <defs>
    <linearGradient id="mark" x1="310" y1="175" x2="720" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9FFF0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#075A3B" flood-opacity="0.26"/>
    </filter>
    <path id="viewfinder" d="
      M 304 160 H 238 Q 160 160 160 238 V 304
      M 720 160 H 786 Q 864 160 864 238 V 304
      M 864 720 V 786 Q 864 864 786 864 H 720
      M 304 864 H 238 Q 160 864 160 786 V 720"/>
  </defs>

  <g fill="none" stroke="url(#mark)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-shadow)">
    <use href="#viewfinder"/>
    <use href="#viewfinder" transform="translate(512 512) scale(.78) translate(-512 -512)"/>
    <use href="#viewfinder" transform="translate(512 512) scale(.60) translate(-512 -512)"/>
    <use href="#viewfinder" transform="translate(512 512) scale(.45) translate(-512 -512)"/>
    <use href="#viewfinder" transform="translate(512 512) scale(.32) translate(-512 -512)"/>
    <use href="#viewfinder" transform="translate(512 512) scale(.21) translate(-512 -512)"/>
  </g>
</svg>
